{% if pagination.is_paginated %}<nav aria-label="{{ pagination.anchor|title }} report pages"><ul class="pagination">
{% if pagination.page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ pagination.filter_query }}&amp;{{ pagination.page_key }}={{ pagination.page_obj.previous_page_number }}#{{ pagination.anchor }}">Previous</a></li>{% endif %}
<li class="page-item disabled"><span class="page-link">Page {{ pagination.page_obj.number }} of {{ pagination.page_obj.paginator.num_pages }}</span></li>
{% if pagination.page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ pagination.filter_query }}&amp;{{ pagination.page_key }}={{ pagination.page_obj.next_page_number }}#{{ pagination.anchor }}">Next</a></li>{% endif %}
</ul></nav>{% endif %}
